# Local stack for the voice agent + Architecture Simulator.
#
#   docker compose up --build        # API on :8000, simulator at :8000/lab
#   docker compose --profile ui up   # + simulator dev server (hot reload) on :5173
#
# Postgres and Redis are here because the simulator teaches the roles they play
# (durable record / ephemeral session state) and the voice agent can use them
# locally instead of Supabase. Neither is required for the simulator itself:
# the simulation engine runs entirely in the browser with no backend at all.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Point the agent at the local Postgres/Redis instead of managed services.
      DATABASE_URL: postgresql://voice:voice@postgres:5432/voice
      REDIS_URL: redis://redis:6379/0
      # Secrets come from a local .env (gitignored). Absent values simply
      # disable the corresponding capability; the app still starts.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OUTBOUND_API_KEY: ${OUTBOUND_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    # The image builds the simulator UI itself (see the `ui` stage in the
    # Dockerfile), so /lab works straight out of `docker compose up --build`.
    # For iterating on the UI, use the `ui` profile below instead of a bind
    # mount — an empty host dist/ would shadow the image's build.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Optional: serve the simulator on its own port with hot reload for UI work.
  simulator:
    profiles: ['ui']
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    volumes:
      - ./simulator:/app
      - simulator_node_modules:/app/node_modules
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Migrations run in lexical order on first boot of an empty volume.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voice -d voice']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Session state is ephemeral by design: bounded memory, LRU on overflow.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  simulator_node_modules:
