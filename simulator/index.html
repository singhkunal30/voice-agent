<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Voice Agent Architecture Simulator & Learning Lab — a flight simulator for voice/AI systems architecture." />
    <title>Voice Agent Architecture Simulator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎛️</text></svg>" />
  </head>
  <body class="bg-ink-950 text-ink-100 antialiased">
    <div id="root"></div>
    <script>
      // Paint the stored theme before first render so there is no flash.
      try {
        var t = JSON.parse(localStorage.getItem('voice-sim:theme') || '"dark"')
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
